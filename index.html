<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>퀴즈</title>

    <style>
    body{
        background-color:rgb(55, 53, 62);
        display:flex; /* 플렉스 박스 사용 */
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }
    .game{
        background-color: rgb(68, 68, 78);
        width:600px;
        padding:40px;
        border-radius:20px;
        text-align:center;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
    }
    h1{
        color : rgb(211, 218, 217);
        font-size: 60px;
        margin-bottom:10px;
    }
    h2{
        color : rgb(211, 218, 217);
        font-size: 35px;
        margin-bottom:30px;
    }
    h3{
        color : rgb(211, 218, 217);
        font-size: 25px;
    }
    button{
        background-color: rgb(113, 90, 90);
        color:rgb(211, 218, 217);
        border:none;
        border-radius:12px;
        padding:15px 30px;
        font-size:23px;
        cursor:pointer;
        transition:0.2s ease;
    }
    button:hover{
        transform:scale(1.05);
        background-color:#836868;
    }
    #gameScreen{
        display:none;/* 게임 화면 숨김 */
    }
    #endScreen{
        display:none;/* 게임 끝 화면 숨김 */
    }

    </style>

</head>
<body>

    <div class="game"><!-- 게임 전체 컨테이너 -->
        <div id ="menu"><!-- 메뉴 화면 -->
            <h1>단축키 퀴즈</h1>
            <button id="button">문제 시작</button>
        </div>
    
        <div id="gameScreen"><!-- 게임 화면 -->
            <h1 id="time"></h1>
            <h2 id="question"></h2>
            <h3 id="result"></h3>
            <h3 id="score"></h3>
        </div>

        <div id="endScreen"><!-- 게임 끝 화면 -->
            <h1>게임 끝!</h1>
            <h2 id="finalScore"></h2>
            <h3 id="grade"></h3>
            <button id="restart">다시 시작</button>
        </div>
    </div>

    

    <script>
        let time = 10;
        let timerId;

        let score = 0;
        //문제 목록
        let questions = [
            { q: "복사 단축키?", key: "c", ctrl: true },
            { q: "붙여넣기 단축키?", key: "v", ctrl: true },
            { q: "되돌리기 단축키?", key: "z", ctrl: true },
            { q: "잘라내기 단축키?", key: "x", ctrl: true }
        ];

        //현재 문제 번호
        let current = 0;

        let start = false;
        //문제 출력
        function startQuestion() {
            document.getElementById("button").style.display = "none";// 버튼 숨김
            document.getElementById("question").innerText = questions[current].q;// question 이라는 Id를 가진 text에 qusition 배열의 q값을 출력
            startTimer();// 타이머 시작
            start = true;
        }

        function startTimer() {
            clearInterval(timerId);
            time = 10;//시간 초기화
            document.getElementById("time").innerText = time;//화면에 10초 표시 
            timerId = setInterval(() => {//1초마다 실행
                if (current >= questions.length) {//문제 끝나면 타이머 멈춤
                    clearInterval(timerId);
                    return;
                }
                time--;
                document.getElementById("time").innerText = time;//화면에 시간 표시

                if (time===0){
                    document.getElementById("result").innerText = "시간 초과";// 시간 초과 표시
                    nextQuestion();//다음 문제
                }
            
            }, 1000);
        }
                

        function nextQuestion() {// 다음 문제
            clearInterval(timerId);// 타이머 멈춤
            document.getElementById("score").innerText = score + "점";// 점수 화면에 표시
            current++;// 문제 번호 증가

            if (current < questions.length) {// 다음 문제가 있으면
                startTimer();
                document.getElementById("question").innerText = questions[current].q;
            } else {//없으면
                result();
                clearInterval(timerId);
            }

        }

        function result() {
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("endScreen").style.display = "block";
            document.getElementById("finalScore").innerText = "점수 : " + score + " / " + questions.length;

            if(score === questions.length){
                document.getElementById("grade").innerText = "PERFECT";
            }else if(score >= 3){
                document.getElementById("grade").innerText = "GOOD";
            }else{
                document.getElementById("grade").innerText = "TRY AGAIN";
            }
        }
                
        document.addEventListener("keydown", function(e) {

            if (current >= questions.length) return;//문제 끝나면 인식 x
            if (e.key === "Control") return;// Ctrl 키 자체는 무시
            if (start===false) return;

            let q = questions[current];//현재 문제

            // 정답 체크
            if (e.ctrlKey === q.ctrl && e.key.toLowerCase() === q.key) {
                document.getElementById("result").innerText = "정답";
                score++;// 점수 증가
                nextQuestion();// 다음 문제

            }else {
                document.getElementById("result").innerText = "오답";// 오답 표시
                nextQuestion();// 다음 문제
            }
        });

        document.getElementById("button").addEventListener("click", function() {// 시작 버튼 클릭 시
            document.getElementById("menu").style.display = "none"; // 메뉴 숨김
            document.getElementById("gameScreen").style.display = "block"; // 게임 화면 표시
            startQuestion(); // 문제 시작
        });

        document.getElementById("restart").addEventListener("click", function() { // 다시 시작 버튼 클릭 시
            current = 0; // 문제 번호 초기화
            score = 0; // 점수 초기화
            document.getElementById("result").innerText = ""; // 결과 초기화
            document.getElementById("score").innerText = score; // 점수 초기화
            document.getElementById("endScreen").style.display = "none"; // 게임 끝 화면 숨김
            document.getElementById("gameScreen").style.display = "block"; // 게임 화면 표시
            startQuestion(); // 문제 시작
        });
    </script>
</body>
</html>
