<!DOCTYPE html><!-- -->
<html>
<head>
    <meta charset="UTF-8">
    <title>퀴즈</title>

    <style>
    body{
        background-color:rgb(55, 53, 62);
        display:flex; /* 플렉스 박스 사용 */
        justify-content:center; /* 수평 중앙 정렬 */
        align-items:center; /* 수직 중앙 정렬 */
        height:100vh; /* 화면 전체 높이 */
        margin:0;
    }
    .game{
        background-color: rgb(68, 68, 78); 
        width:550px;
        padding:10px 40px 40px 40px;
        border-radius:20px;
        text-align:center; /* 텍스트 중앙 정렬 */
        box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
    }
    h1{
        color : rgb(211, 218, 217);
        font-size: 60px;
        margin-bottom:10px;
    }
    h2{
        color : rgb(211, 218, 217);
        font-size: 35px;
        margin-bottom:30px;
    }
    h3{
        color : rgb(211, 218, 217);
        font-size: 25px;
    }
    button{
        background-color: rgb(113, 90, 90);
        color:rgb(211, 218, 217);
        border:none;
        border-radius:12px;
        padding:15px 30px;
        font-size:23px;
        cursor:pointer;
        transition:0.2s ease;
    }
    button:hover{
        transform:scale(1.05);
        background-color:#836868;
    }
    #gameScreen{
        display:none;/* 게임 화면 숨김 */
    }
    #endScreen{
        display:none;/* 게임 끝 화면 숨김 */
        padding :20px;
    }
    #finalScore{
        margin-top:0px;
        margin-bottom : 0px;
    }
    #grade{
        margin-top:0px;
        margin-bottom: 0px;
        font-size:50px;
        font-weight:bold;
    }
    #restart, #menuButton{
        margin-top:10px;
        margin-left: 5px;
        margin-right: 5px;
    }
    #categoryBar{
        display:flex;
        justify-content:center;
        margin-bottom:20px;
    }
    .categoryBtn{
        background-color:#37353E;
        color:#D3DAD9;
        border:none;
        font-size:18px;
        cursor:pointer;
        transition:0.2s ease;
    }
    .categoryBtn:hover{
        background-color:#715A5A;
        transform:scale(1.1);
    }
    .selectedCategory{
        background-color:#715A5A;
        transform:scale(1.1);
    }
    #review{
        max-height:250px;
        overflow-y:auto;
    }

    #studyScreen{
        display:none; /* 학습 화면 숨김 */
    }

    #studyList{
        max-height:300px;
        overflow-y:auto;
        text-align:left;
    }

    </style>
</head>
<body>
    <div class="game"><!-- 게임 전체 컨테이너 -->
        <div id ="menu"><!-- 메뉴 화면 -->
            <div id="categoryBar">
                <button class="categoryBtn" onclick="selectCategory('Windows', this)">Windows</button>
                <button class="categoryBtn" onclick="selectCategory('Linux', this)">Linux</button>
            </div>

            <h1>단축키 퀴즈</h1>
            <button id="studyButton">학습하기</button>
            <button id="startButton">문제 시작</button>
            
        </div>
        
        <div id="studyScreen"><!-- 학습 화면-->
            <h1>학습하기</h1>
            <div id="studyList"></div>
            <button id="backMenu">메뉴로</button>
        </div>

        <div id="gameScreen"><!-- 게임 화면 -->
            <h1 id="time"></h1>
            <h2 id="question"></h2>
            <h3 id="score"></h3>
            <h3 id="currentInput">현재 입력</h3>
        </div>

        <div id="endScreen"><!-- 게임 끝 화면 -->
            <h1>게임 끝!</h1>
            <h2 id="finalScore"></h2>
            <h3 id="grade"></h3>
            <div id="review"></div>
            <button id="restart">다시 시작</button>
            <button id="menuButton">메뉴로</button>
        </div>
    </div>

    <script>
        let time = 10;
        let timerId;

        let score = 0;//문제 목록
        
        let originalQuestions = [
            { q: "복사", keys: ["control", "c"], category: "Windows" },
            { q: "붙여넣기", keys: ["control", "v"], category: "Windows" },
            { q: "되돌리기", keys: ["control", "z"], category: "Windows" },
            { q: "잘라내기", keys: ["control", "x"], category: "Windows" },
            { q: "전체 선택", keys: ["control", "a"], category: "Windows" },
            { q: "새로고침", keys: ["f5"], category: "Windows" },
            { q: "인쇄", keys:["control","p"], category:"Windows" },
            { q: "찾기", keys:["control","f"], category:"Windows" },
            { q: "저장", keys:["control","s"], category:"Windows" },
            { q: "열기", keys:["control","o"], category:"Windows" },
            { q: "전체화면", keys:["f11"], category:"Windows" },
            { q: "파일 이름 바꾸기", keys:["f2"], category:"Windows" },
            { q: "우클릭 메뉴", keys:["shift","f10"], category:"Windows" },
            { q: "다시 실행 단축키", keys:["control","y"], category:"Windows" },
            { q: "단어 단위로 왼쪽 이동", keys:["control","arrowleft"], category:"Windows" },
            { q: "단어 단위로 오른쪽 이동", keys:["control","arrowright"], category:"Windows" },
            { q: "단어 단위로 삭제", keys:["control","backspace"], category:"Windows" },
            { q: "문서 맨 앞으로 이동", keys:["control","home"], category:"Windows" },
            { q: "문서 맨 뒤로 이동", keys:["control","end"], category:"Windows" },
            { q: "현재 줄 맨 앞으로 이동", keys:["home"], category:"Windows" },
            { q: "현재 줄 맨 뒤로 이동", keys:["end"], category:"Windows" },

            { q: "터미널 화면 지우기", keys: ["control", "l"], category: "Linux" },
            { q: "프로그램 강제 종료", keys: ["control", "q"], category: "Linux" },
            { q: "터미널 종료", keys: ["control", "c"], category: "Linux" }
        ];
        let questions = [];
        let totalQuestions = 0;
        let currentQuestion;//현재 문제

        let currentCategory = "";

        let start = false;//문제 출력

        let pressedKeys = [];// 누른 키 배열
        
        const correctColor = "rgb(22, 196, 127)";
        const timeoutColor = "rgb(255, 157, 35)";
        const wrongColor = "rgb(249, 56, 39)";

        let wrongQuestions = [];// 틀린 문제 배열

        function selectCategory(category, button) { // 카테고리 선택 함수
            currentCategory = category;// 선택한 카테고리 저장

            questions = originalQuestions.filter(
                q => q.category === category // 선택한 카테고리에 맞는 문제로 필터링
            );
            totalQuestions = questions.length; // 총 문제 수 업데이트

            let buttons = document.querySelectorAll(".categoryBtn");
            buttons.forEach(btn => {
                btn.classList.remove("selectedCategory"); // 모든 버튼에서 선택된 클래스 제거
            });
            button.classList.add("selectedCategory"); // 선택한 버튼에 선택된 클래스 추가
        }

        function startQuestion() {
            let randomIndex = Math.floor(Math.random() * questions.length);//문제 배열에서 랜덤으로 문제 선택
            currentQuestion = questions[randomIndex];
            document.getElementById("question").innerText = currentQuestion.q + " (" + (totalQuestions - questions.length) + " / " + totalQuestions + ")";// question 이라는 Id를 가진 text에 qusition 배열의 q값을 출력
            questions.splice(randomIndex, 1);//문제 배열에서 출제된 문제 제거
            document.getElementById("score").innerText = score + "점";
            startTimer();// 타이머 시작
            document.getElementById("currentInput").innerText = "현재 입력: " + formatKeys(pressedKeys);
            start = true;
        }

        function startTimer() {
            clearInterval(timerId);
            time = 10;//시간 초기화
            document.getElementById("time").style.color = "rgb(211, 218, 217)";

            document.getElementById("time").innerText = time;//화면에 10초 표시 
            timerId = setInterval(() => {//1초마다 실행
                time--;
                document.getElementById("time").innerText = time;//화면에 시간 표시
                
                if (time <= 3) {
                    document.getElementById("time").style.color = wrongColor;// 시간이 3초 이하일 때 빨간색으로 표시
                } else {
                    document.getElementById("time").style.color = "rgb(211, 218, 217)";// 그 외에는 흰색으로 표시
                }

                if (time===0){
                    document.getElementById("time").innerText = "시간 초과";// 시간 초과 표시
                    document.getElementById("time").style.color = timeoutColor;
                    clearInterval(timerId);// 타이머 멈춤
                    start = false;

                    wrongQuestions.push({// 틀린 문제 배열에 추가
                        question: currentQuestion.q,
                        userInput: "입력 없음",
                        answer: currentQuestion.keys.join(" + ")
                    })

                    setTimeout(() => {
                        nextQuestion();// 다음 문제
                    }, 1000);
                }
            }, 1000);
        }
            
        function nextQuestion() {// 다음 문제
            document.getElementById("score").innerText = score + "점";// 점수 화면에 표시

            if (questions.length > 0) {// 다음 문제가 있으면
                startQuestion();
            } else {//없으면
                result();
            }
        }

        document.addEventListener("keydown", function(e) {

            e.preventDefault(); // 기본 키 동작 방지 (예: Ctrl+C가 복사하는 것을 방지)
            if (start===false) return;// 게임이 시작되지 않았으면 무시
            
            let currentInput = [];// 현재 입력 배열
            if (e.ctrlKey) currentInput.push("Ctrl");//push는 배열에 추가
            if (e.shiftKey) currentInput.push("Shift");
            if (e.altKey) currentInput.push("Alt");
            if (e.metaKey) currentInput.push("Windows");

            const modifiers = ["Control", "Shift", "Alt", "Meta"];
            if (!modifiers.includes(e.key)) { // 누른 키가 Ctrl, Shift, Alt, Meta 중 하나가 아니면  
                currentInput.push(e.key.toUpperCase());
            }
            document.getElementById("currentInput").innerText = "현재 입력: " + formatKeys(currentInput);// 현재 입력 표시
            let lastInput = [...currentInput];// 마지막 입력 저장
            
            let pressedKeys = [];// 누른 키 배열

            if (e.key === "Control") return;// Ctrl 키 자체는 무시
            if (e.key === "Shift") return;// Shift 키 자체는 무시
            if (e.key === "Alt") return;// Alt 키 자체는 무시
            if (e.key === "Meta") return;// Meta(윈도우) 키 자체는 무시

            let q = currentQuestion;//현재 문제

            if (e.ctrlKey) pressedKeys.push("control");// Ctrl 키가 눌렸는지 확인
            if (e.altKey) pressedKeys.push("alt");// Alt 키가 눌렸는지 확인
            if (e.shiftKey) pressedKeys.push("shift");// Shift 키가 눌렸는지 확인
            pressedKeys.push(e.key.toLowerCase());// 누른 키 추가

            // 정답 체크
            if (JSON.stringify(pressedKeys) === JSON.stringify(q.keys)) { // 누른 키와 현재 문제 키 비교, 그냥 비교하면 false나오므로 JSON.stringify로 문자열로 변환해서 비교 
                document.getElementById("time").style.color = correctColor;
                document.getElementById("time").innerText = "정답";
                clearInterval(timerId);// 타이머 멈춤
                score++;// 점수 증가
                start = false;
                setTimeout(() => {
                    document.getElementById("currentInput").innerText = lastInput
                    nextQuestion();// 다음 문제
                }, 1000);

            }else {
                document.getElementById("time").style.color = wrongColor;
                document.getElementById("time").innerText = "오답\n정답: " + formatKeys(currentQuestion.keys);
                clearInterval(timerId);// 타이머 멈춤
                start = false;

                wrongQuestions.push({// 틀린 문제 배열에 추가
                    question: currentQuestion.q,
                    userInput: formatKeys(pressedKeys),
                    answer: formatKeys(currentQuestion.keys)
                })

                setTimeout(() => {
                    document.getElementById("currentInput").innerText = lastInput
                    nextQuestion();// 다음 문제
                }, 2000);
            }
        });

        document.addEventListener("keyup", function(e) {// 키를 뗄 때
            pressedKeys = pressedKeys.filter(// 누른 키 배열에서 뗀 키 제거
                key => key !== e.key
            );

            if (start === false) return;// 게임이 시작되지 않았으면 무시
            document.getElementById("currentInput").innerText = "현재 입력: " + formatKeys(pressedKeys);
        });

        function result() {
            start = false;
            clearInterval(timerId);
            showScreen("endScreen");// 게임 끝 화면 표시
            document.getElementById("finalScore").innerText = "점수 : " + score + " / " + totalQuestions;// 최종 점수 표시

            let percent = score / totalQuestions * 100;// 점수 백분율 계산
            if(percent === 100){
                document.getElementById("grade").style.color = correctColor;
                document.getElementById("grade").innerText = "PERFECT";
            }else if(percent >= 70){
                document.getElementById("grade").style.color = timeoutColor;
                document.getElementById("grade").innerText = "GOOD";
            }else{
                document.getElementById("grade").style.color = wrongColor;
                document.getElementById("grade").innerText = "TRY AGAIN";
            }

            let reviewHTML = "<h2>복습</h2>";
            reviewHTML += "<hr>";

            for (let wrong of wrongQuestions) {// 틀린 문제마다 복습 내용 추가
                reviewHTML += "<div class='reviewItem'>";
                reviewHTML += "<h3><b>문제:</b> " + formatKeys(wrong.question) + "</h3>";
                reviewHTML += "<h3><b>내 입력:</b> " + formatKeys(wrong.userInput) + "</h3>";
                reviewHTML += "<h3><b>정답:</b> " + formatKeys(wrong.answer) + "</h3>";
                reviewHTML += "</div>";
                reviewHTML += "<hr>";

                if (wrongQuestions.length === 0) {
                    reviewHTML += "<h2>전부 맞혔습니다!</h2>";
                }
            }

            document.getElementById("review").innerHTML = reviewHTML;
        }

        function showScreen(screenId) {
            document.getElementById("menu").style.display = "none";
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("endScreen").style.display = "none";
            document.getElementById(screenId).style.display = "block";
        }

        function formatKeys(keys) {
            let result = []

            for (let key of keys) {
                if (key === "control") result.push("Ctrl");
                else if (key === "alt") result.push("Alt");
                else if (key === "shift") result.push("Shift");
                else if (key === "meta") result.push("Windows");
                else if (key === "arrowleft") result.push("←");
                else if (key === "arrowright") result.push("→");
                else if (key === "ARROWLEFT") result.push("←");
                else if (key === "ARROWRIGHT") result.push("→");
                else result.push(key.toUpperCase());
            }
            return result.join(" + ");
        }
                
        document.getElementById("startButton").addEventListener("click", function() {// 시작 버튼 클릭 시
            if(currentCategory === "") {
                alert("카테고리를 선택해주세요!");// 카테고리 선택 안했을 때 경고창
                return;
            }
            
            showScreen("gameScreen"); // 게임 화면 표시
            startQuestion(); // 문제 시작
        });

        document.getElementById("studyButton").addEventListener("click", function() { // 학습하기 버튼 클릭 시
            if(currentCategory === "") {
                alert("카테고리를 선택해주세요!");// 카테고리 선택 안했을 때 경고창
                return;
            }

            document.getElementById("menu").style.display = "none";
            document.getElementById("studyScreen").style.display = "block";

            let studyHTML = "";

            let categoryQuestions = originalQuestions.filter(q => q.category === currentCategory);

            for (let q of categoryQuestions) {
                studyHTML += "<h3><b>문제:</b> " + q.q + "</h3>";
                studyHTML += "<h3><b>정답:</b> " + formatKeys(q.keys) + "</h3>";
                studyHTML += "<hr>";
            }
            document.getElementById("studyList").innerHTML = studyHTML;
        });

        document.getElementById("backMenu").addEventListener("click", function(){

            document.getElementById("studyScreen").style.display = "none";
            document.getElementById("menu").style.display = "block";

        });

        document.getElementById("restart").addEventListener("click", function() { // 다시 시작 버튼 클릭 시
            questions = originalQuestions.filter(
                q => q.category === currentCategory // 초기 카테고리에 맞는 문제로 시작
            );
            score = 0; // 점수 초기화
            wrongQuestions = [];
            showScreen("gameScreen"); // 게임 화면 표시
            startQuestion(); // 문제 시작
        });

        document.getElementById("menuButton").addEventListener("click", function() { // 메뉴로 버튼 클릭 시
            questions = originalQuestions.filter(
                q => q.category === currentCategory // 초기 카테고리에 맞는 문제로 시작
            );
            score = 0; // 점수 초기화
            wrongQuestions = [];
            showScreen("menu"); // 메뉴 화면 표시
        });

    </script>
</body>
</html>
