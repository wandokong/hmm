<!DOCTYPE html><!-- 어 카테고리 만들면서 문제 생김 지피티한테 물어보며 해결 문제는 문제가 안나옴 그리고 주석에 리드미 작성-->
<html>
<head>
    <meta charset="UTF-8">
    <title>퀴즈</title>

    <style>
    body{
        background-color:rgb(55, 53, 62);
        display:flex; /* 플렉스 박스 사용 */
        justify-content:center; /* 수평 중앙 정렬 */
        align-items:center; /* 수직 중앙 정렬 */
        height:100vh; /* 화면 전체 높이 */
        margin:0;
    }
    .game{
        background-color: rgb(68, 68, 78); 
        width:550px;
        padding:10px 40px 40px 40px;
        border-radius:20px;
        text-align:center; /* 텍스트 중앙 정렬 */
        box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
    }
    h1{
        color : rgb(211, 218, 217);
        font-size: 60px;
        margin-bottom:10px;
    }
    h2{
        color : rgb(211, 218, 217);
        font-size: 35px;
        margin-bottom:30px;
    }
    h3{
        color : rgb(211, 218, 217);
        font-size: 25px;
    }
    button{
        background-color: rgb(113, 90, 90);
        color:rgb(211, 218, 217);
        border:none;
        border-radius:12px;
        padding:15px 30px;
        font-size:23px;
        cursor:pointer;
        transition:0.2s ease;
    }
    button:hover{
        transform:scale(1.05);
        background-color:#836868;
    }
    #gameScreen{
        display:none;/* 게임 화면 숨김 */
    }
    #endScreen{
        display:none;/* 게임 끝 화면 숨김 */
        padding :20px;
    }
    #finalScore{
        margin-top:0px;
        margin-bottom : 0px;
    }
    #grade{
        margin-top:0px;
        margin-bottom: 0px;
        font-size:50px;
        font-weight:bold;
    }
    #restart, #menuButton{
        margin-top:10px;
        margin-left: 5px;
        margin-right: 5px;
    }

    </style>

</head>
<body>

    <div class="game"><!-- 게임 전체 컨테이너 -->
        <div id ="menu"><!-- 메뉴 화면 -->
            <button onclick="selectCategory('Windows')">Windows</button>
            <button onclick="selectCategory('Linux')">Linux</button>

            <h1>단축키 퀴즈</h1>
            <button id="button">문제 시작</button>
        </div>
    
        <div id="gameScreen"><!-- 게임 화면 -->
            <h1 id="time"></h1>
            <h2 id="question"></h2>
            <h3 id="result"></h3>
            <h3 id="score"></h3>
        </div>

        <div id="endScreen"><!-- 게임 끝 화면 -->
            <h1>게임 끝!</h1>
            <h2 id="finalScore"></h2>
            <h3 id="grade"></h3>
            <button id="restart">다시 시작</button>
            <button id="menuButton">메뉴로</button>
        </div>
    </div>

    

    <script>
        let time = 10;
        let timerId;

        let score = 0;
        //문제 목록
        let originalQuestions = [
            { q: "복사 단축키?", key: "c", ctrl: true, category: "Windows" },
            { q: "붙여넣기 단축키?", key: "v", ctrl: true, category: "Windows" },
            { q: "되돌리기 단축키?", key: "z", ctrl: true, category: "Windows" },
            { q: "잘라내기 단축키?", key: "x", ctrl: true, category: "Windows" },
            { q: "터미널 화면 지우기?", key: "l", ctrl: true, category: "Linux" },
            { q: "프로그램 강제 종료?", key: "q", ctrl: true, category: "Linux" }
        ];

        let currentCategory = "";

        let questions = [];

        let totalQuestions = [];

        //현재 문제
        let currentQuestion;

        let start = false;
        //문제 출력

        function selectCategory(category) { // 카테고리 선택 함수
            currentCategory = category;// 선택한 카테고리 저장

            questions = originalQuestions.filter(
                q => q.category === category // 선택한 카테고리에 맞는 문제로 필터링
            );

            totalQuestions = questions.length; // 총 문제 수 업데이트
        }

        function startQuestion() {
            let randomIndex = Math.floor(Math.random() * questions.length);//문제 배열에서 랜덤으로 문제 선택
            currentQuestion = questions[randomIndex];
            document.getElementById("question").innerText = currentQuestion.q;// question 이라는 Id를 가진 text에 qusition 배열의 q값을 출력
            questions.splice(randomIndex, 1);//문제 배열에서 출제된 문제 제거
            document.getElementById("score").innerText = score + "점";
            startTimer();// 타이머 시작
            start = true;
        }

        function startTimer() {
            clearInterval(timerId);
            time = 10;//시간 초기화
            document.getElementById("time").style.color = "rgb(211, 218, 217)";

            document.getElementById("time").innerText = time;//화면에 10초 표시 
            timerId = setInterval(() => {//1초마다 실행
                time--;
                document.getElementById("time").innerText = time;//화면에 시간 표시
                
                if (time <= 3) {
                    document.getElementById("time").style.color = "rgb(249, 56, 39)";// 시간이 3초 이하일 때 빨간색으로 표시
                } else {
                    document.getElementById("time").style.color = "rgb(211, 218, 217)";// 그 외에는 흰색으로 표시
                }

                if (time===0){
                    document.getElementById("result").innerText = "시간 초과";// 시간 초과 표시
                    console.log("시간 초과");
                    document.getElementById("result").style.color = "rgb(255, 157, 35)";
                    nextQuestion();//다음 문제
                }
            
            }, 1000);
        }
                

        function nextQuestion() {// 다음 문제
            clearInterval(timerId);// 타이머 멈춤
            document.getElementById("score").innerText = score + "점";// 점수 화면에 표시

            if (questions.length > 0) {// 다음 문제가 있으면
                startQuestion();
            } else {//없으면
                result();
            }

        }

        document.addEventListener("keydown", function(e) {
            e.preventDefault(); // 기본 키 동작 방지 (예: Ctrl+C가 복사하는 것을 방지)
            
            if (e.key === "Control") return;// Ctrl 키 자체는 무시
            if (start===false) return;

            let q = currentQuestion;//현재 문제

            // 정답 체크
            if (e.ctrlKey === q.ctrl && e.key.toLowerCase() === q.key) {
                document.getElementById("result").innerText = "정답";
                document.getElementById("result").style.color = "rgb(22, 196, 127)";
                score++;// 점수 증가
                nextQuestion();// 다음 문제

            }else {
                document.getElementById("result").innerText = "오답";// 오답 표시
                document.getElementById("result").style.color = "rgb(249, 56, 39)";
                nextQuestion();// 다음 문제
            }
        });

        function result() {
            start = false;
            clearInterval(timerId);
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("endScreen").style.display = "block";
            document.getElementById("finalScore").innerText = "점수 : " + score + " / " + totalQuestions;// 최종 점수 표시

            if(score === totalQuestions){
                document.getElementById("grade").style.color = "green";
                document.getElementById("grade").innerText = "PERFECT";
            }else if(score >= 3){
                document.getElementById("grade").style.color = "blue";
                document.getElementById("grade").innerText = "GOOD";
            }else{
                document.getElementById("grade").style.color = "red";
                document.getElementById("grade").innerText = "TRY AGAIN";
            }
        }
                

        document.getElementById("button").addEventListener("click", function() {// 시작 버튼 클릭 시
            if(currentCategory === "") {
                alert("카테고리를 선택해주세요!");// 카테고리 선택 안했을 때 경고창
                return;
            }
            
            document.getElementById("menu").style.display = "none"; // 메뉴 숨김
            document.getElementById("gameScreen").style.display = "block"; // 게임 화면 표시
            startQuestion(); // 문제 시작
        });

        document.getElementById("restart").addEventListener("click", function() { // 다시 시작 버튼 클릭 시
            questions = originalQuestions.filter(
            q => q.category === currentCategory // 초기 카테고리에 맞는 문제로 시작
            );
            score = 0; // 점수 초기화
            document.getElementById("result").innerText = ""; // 결과 초기화
            document.getElementById("score").innerText = score; // 점수 초기화
            document.getElementById("endScreen").style.display = "none"; // 게임 끝 화면 숨김
            document.getElementById("gameScreen").style.display = "block"; // 게임 화면 표시
            startQuestion(); // 문제 시작
        });

        document.getElementById("menuButton").addEventListener("click", function() { // 메뉴로 버튼 클릭 시
            questions = originalQuestions.filter(
            q => q.category === currentCategory // 초기 카테고리에 맞는 문제로 시작
            );
            score = 0; // 점수 초기화
            document.getElementById("result").innerText = ""; // 결과 초기화
            document.getElementById("score").innerText = score; // 점수 초기화
            document.getElementById("endScreen").style.display = "none"; // 게임 끝 화면 숨김
            document.getElementById("menu").style.display = "block"; // 메뉴 화면 표시
        });
    </script>
</body>
</html>
