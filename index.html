<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>퀴즈</title>
</head>
<body>
    <h1 id="time"></h1>
    <h2 id="question"></h2>
    <button onclick="showQuestion()" id="button">문제 시작</button>
    <h3 id="result"></h3>
    <h3 id="score"></h3>

    <script>
        let time = 10;
        let timerId;

        let score = 0;
        //문제 목록
        let questions = [
            { q: "복사 단축키?", key: "c", ctrl: true },
            { q: "붙여넣기 단축키?", key: "v", ctrl: true },
            { q: "되돌리기 단축키?", key: "z", ctrl: true },
            { q: "잘라내기 단축키?", key: "x", ctrl: true }
        ];

        //현재 문제 번호
        let current = 0;

        let start = false;
        //문제 출력
        function showQuestion() {
            document.getElementById("button").style.display = "none";// 버튼 숨김
            document.getElementById("question").innerText = questions[current].q;// question 이라는 Id를 가진 text에 qusition 배열의 q값을 출력
            document.getElementById("score").innerText = score;
            startTimer();// 타이머 시작
            start = true;
        }

        function startTimer() {
            clearInterval(timerId);
            time = 10;//시간 초기화
            document.getElementById("time").innerText = time;//화면에 10초 표시 
            timerId = setInterval(() => {//1초마다 실행
                if (current >= questions.length) {//문제 끝나면 타이머 멈춤
                    clearInterval(timerId);
                    return;
                }
                time--;
                document.getElementById("time").innerText = time;//화면에 시간 표시

                if (time===0){
                    document.getElementById("result").innerText = "시간 초과";// 시간 초과 표시
                    nextQuestion();//다음 문제
                }
            
            }, 1000);
        }
                

        function nextQuestion() {// 다음 문제
            clearInterval(timerId);// 타이머 멈춤
            document.getElementById("score").innerText = score;// 점수 화면에 표시
            current++;// 문제 번호 증가

            if (current < questions.length) {// 다음 문제가 있으면
                startTimer();
                document.getElementById("question").innerText = questions[current].q;
            } else {//없으면
                document.getElementById("question").innerText = "끝!";
                clearInterval(timerId);
            }

        }

                
        document.addEventListener("keydown", function(e) {

            if (current >= questions.length) return;//문제 끝나면 인식 x
            if (e.key === "Control") return;// Ctrl 키 자체는 무시
            if (start===false) return;

            let q = questions[current];//현재 문제

            // 정답 체크
            if (e.ctrlKey === q.ctrl && e.key.toLowerCase() === q.key) {
                document.getElementById("result").innerText = "정답";
                score++;// 점수 증가
                nextQuestion();// 다음 문제

            }else {
                document.getElementById("result").innerText = "오답";// 오답 표시
                nextQuestion();// 다음 문제
            }
        });

    </script>
</body>
</html>
